services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-peptidetech}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-peptidetech123}
    ports:
      - "${MINIO_API_PORT:-13002}:9000"
      - "${MINIO_CONSOLE_PORT:-13003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-peptidetech} ${MINIO_ROOT_PASSWORD:-peptidetech123} &&
      mc mb -p local/${MINIO_BUCKET_NAME:-peptidetech} &&
      mc anonymous set download local/${MINIO_BUCKET_NAME:-peptidetech}
      "

volumes:
  minio_data:
