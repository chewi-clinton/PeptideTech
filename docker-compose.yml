services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: peptidetech
      POSTGRES_PASSWORD: peptidetech
      POSTGRES_DB: peptidetech
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peptidetech"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: peptidetech
      MINIO_ROOT_PASSWORD: peptidetech123
    ports:
      - "13002:9000"
      - "13003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 peptidetech peptidetech123 &&
      mc mb -p local/peptidetech &&
      mc anonymous set download local/peptidetech
      "

  backend:
    build: ./backend
    environment:
      SECRET_KEY: local-dev-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://peptidetech:peptidetech@postgres:5432/peptidetech
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: peptidetech
      MINIO_SECRET_KEY: peptidetech123
      MINIO_BUCKET_NAME: peptidetech
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
      API_URL_INTERNAL: http://backend:8000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
